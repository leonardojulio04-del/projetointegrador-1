<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background-image: url("https://images.unsplash.com/photo-1518770660439-4636190af475");
            background-size: cover;
            background-position: center;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.75);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            padding: 25px;
            border-radius: 10px;
            width: 400px;
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 6px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00d9ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #009fb8;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #00d9ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="overlay">

        <div class="card">

            <h2>Editar Usuário</h2>

            <form action="/user/update/{{ usuario.id }}" method="POST">

                <input type="text" name="nome" value="{{ usuario.nome }}" placeholder="Nome">
                <input type="text" name="login" value="{{ usuario.login }}" placeholder="Login">
                <input type="password" name="senha" value="{{ usuario.senha }}" placeholder="Senha">
                <input type="email" name="email" value="{{ usuario.email }}" placeholder="Email">
                <input type="text" name="telefone" value="{{ usuario.telefone }}" placeholder="Telefone">

                <button type="submit">Atualizar</button>

            </form>

            <a href="/user">Voltar</a>

        </div>

    </div>

</body>

</html>
